<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahlers Arcade Sportsbook Ticker</title>
  <style>
    /* ==========================================================================
       1. CORE STYLES & PERFORMANCE OPTIMIZATIONS
       ========================================================================== */
    :root {
      --accent-color: #00ffff;
      --accent-border: rgba(0, 255, 255, 0.4);
      --accent-shadow: rgba(0, 255, 255, 0.2);
    }

    body.theme-cyan {
      --accent-color: #00ffff;
      --accent-border: rgba(0, 255, 255, 0.4);
      --accent-shadow: rgba(0, 255, 255, 0.2);
    }

    body.theme-pink {
      --accent-color: #ff007f;
      --accent-border: rgba(255, 0, 127, 0.4);
      --accent-shadow: rgba(255, 0, 127, 0.2);
    }

    body.theme-green {
      --accent-color: #39ff14;
      --accent-border: rgba(57, 255, 20, 0.4);
      --accent-shadow: rgba(57, 255, 20, 0.2);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    /* Icy Dynamic Gradient Wallpaper (GPU Friendly) */
    body {
      background: radial-gradient(circle at 50% 20%, #0f1c2e 0%, #050a12 85%);
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .icy-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 80% 80%, rgba(0, 255, 255, 0.05), transparent 50%),
                  radial-gradient(circle at 20% 20%, rgba(255, 0, 127, 0.05), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* App Layout */
    .app-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Top Control Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1vh 2vw;
      height: 6vh;
      background: rgba(5, 10, 18, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .clock-display {
      font-size: 2.2vh;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .top-controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: transform 0.2s;
    }

    .icon-btn svg {
      width: 2.5vh;
      height: 2.5vh;
      fill: #ffffff;
    }

    .icon-btn:hover {
      transform: scale(1.1);
    }

    /* Screen Title Headers */
    .screen-header {
      text-align: center;
      height: 6.5vh;
      margin-top: 1vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen-header h1 {
      margin: 0;
      font-size: 4vh;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-color);
      transition: color 0.5s ease;
    }

    /* Dynamic Neon Elements */
    .neon-accent {
      color: var(--accent-color) !important;
      transition: color 0.5s ease;
    }

    .neon-border {
      border-color: var(--accent-border) !important;
      transition: border-color 0.5s ease;
    }

    /* Slide Displays */
    .slide-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      margin: 1vh 2vw;
    }

    .slide-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease-in-out;
      display: flex;
      flex-direction: column;
    }

    .slide-screen.active {
      opacity: 1;
      visibility: visible;
    }

    .scroll-content {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5vh;
      padding-bottom: 2vh;
    }

    /* Static Frosted Glass Cards */
    .glass-card {
      background: rgba(12, 20, 32, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 1.5vh;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Logos & Text Standards */
    .team-logo, .player-headshot {
      filter: drop-shadow(0px 0px 2px #ffffff) drop-shadow(0px 0px 2px #ffffff);
      object-fit: contain;
    }

    .white-text {
      color: #ffffff !important;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    .card-meta {
      font-size: 1.4vh;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent-color);
      margin-bottom: 0.8vh;
      display: flex;
      justify-content: space-between;
      transition: color 0.5s ease;
    }

    /* Live Badge (Opacity Pulse for GPU efficiency) */
    .live-tag {
      background: #ff0055;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 900;
      font-size: 1.2vh;
      animation: pulse-opacity 1.5s infinite;
    }

    @keyframes pulse-opacity {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* MLB Baseball Grid */
    .baseball-tracker {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      text-align: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.8vh;
      border-radius: 6px;
      margin-top: 1vh;
      font-size: 1.4vh;
      font-weight: 700;
    }

    /* Player Prop Layout */
    .prop-card {
      display: flex;
      align-items: center;
      gap: 1.5vw;
    }

    .prop-headshot {
      width: 8vh;
      height: 8vh;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
    }

    .prop-details {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .prop-player-name {
      font-size: 2vh;
      font-weight: 800;
      color: #ffffff;
    }

    .prop-type {
      font-size: 1.5vh;
      color: var(--accent-color);
      font-weight: 700;
      margin-top: 2px;
      word-break: break-word;
      transition: color 0.5s ease;
    }

    .prop-line {
      font-size: 2.2vh;
      font-weight: 900;
      color: #39ff14;
      margin-top: 4px;
    }

    /* Bottom News Ticker Tape */
    .ticker-bottom {
      height: 5vh;
      background: #03070d;
      border-top: 2px solid var(--accent-border);
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      transition: border-color 0.5s ease;
    }

    .ticker-wrap {
      width: 100%;
      overflow: hidden;
    }

    .ticker-move {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: ticker-scroll 30s linear infinite;
    }

    .ticker-item {
      display: inline-block;
      padding: 0 2vw;
      font-size: 1.8vh;
      font-weight: 600;
      color: #ffffff;
    }

    @keyframes ticker-scroll {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    /* Settings Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background: #0c1420;
      border: 2px solid var(--accent-color);
      border-radius: 12px;
      width: 80vw;
      max-width: 600px;
      max-height: 80vh;
      padding: 3vw;
      overflow-y: auto;
      color: #fff;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 1vh;
      margin-bottom: 2vh;
    }

    .toggle-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1vh;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.6vh;
    }
  </style>
</head>
<body class="theme-cyan">

  <div class="icy-overlay"></div>

  <div class="app-container">
    <div class="top-bar">
      <div class="clock-display" id="masterClock">--:-- --</div>
      <div class="top-controls">
        <button class="icon-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
        <button class="icon-btn" onclick="openSettings()" title="Settings">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
    </div>

    <div class="screen-header">
      <h1 id="activeScreenTitle">LIVE ACTION</h1>
    </div>

    <div class="slide-viewport">
      <div class="slide-screen active" id="slide-live" data-title="LIVE ACTION">
        <div class="scroll-content" id="container-live"></div>
      </div>

      <div class="slide-screen" id="slide-mlb" data-title="MLB SCOREBOARD">
        <div class="scroll-content" id="container-mlb"></div>
      </div>

      <div class="slide-screen" id="slide-props" data-title="VEGAS PROP SHOP">
        <div class="scroll-content" id="container-props"></div>
      </div>

      <div class="slide-screen" id="slide-trivia" data-title="TRIVIA BREAK!">
        <div class="scroll-content" id="container-trivia" style="display:flex; justify-content:center; align-items:center; height:100%;">
          <div class="glass-card" style="width: 80%; max-width: 700px; text-align: center; padding: 4vh;">
            <div class="card-meta" id="triviaCategory">SPORTS TRIVIA</div>
            <div class="white-text" id="triviaQuestion" style="font-size: 2.8vh; font-weight: 700; margin: 2vh 0;">Loading Question...</div>
            <div id="triviaAnswers" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5vh; margin-top: 2vh;"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="ticker-bottom">
      <div class="ticker-wrap">
        <div class="ticker-move" id="tickerContent">
          <span class="ticker-item">LOADING SPORTSBOOK TICKER...</span>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Ticker Settings</h2>
        <button class="icon-btn" onclick="closeSettings()">&times;</button>
      </div>
      <div class="toggle-grid">
        <label class="toggle-item"><input type="checkbox" id="toggle-live" checked> Live Action</label>
        <label class="toggle-item"><input type="checkbox" id="toggle-mlb" checked> MLB Scores</label>
        <label class="toggle-item"><input type="checkbox" id="toggle-props" checked> Player Props</label>
        <label class="toggle-item"><input type="checkbox" id="toggle-trivia" checked> Trivia Break</label>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       2. JAVASCRIPT SLIDE ENGINE & DATA FETCHING
       ========================================================================== */
    const neonThemes = ['theme-cyan', 'theme-pink', 'theme-green'];
    let currentThemeIndex = 0;
    let activeSlideIndex = 0;
    let slideTimer = null;

    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('masterClock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Universal Image Fallback Pipeline
    function getFallbackImage(img, teamLogo) {
      img.onerror = null;
      img.src = teamLogo || 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/default-team-logo.png';
    }

    /* Hardware Optimized Per-Slide Color Cycling */
    function cycleSlideColorTheme() {
      document.body.classList.remove(...neonThemes);
      currentThemeIndex = (currentThemeIndex + 1) % neonThemes.length;
      document.body.classList.add(neonThemes[currentThemeIndex]);
    }

    // Slide Switching Logic
    function rotateSlides() {
      const slides = document.querySelectorAll('.slide-screen');
      slides[activeSlideIndex].classList.remove('active');

      activeSlideIndex = (activeSlideIndex + 1) % slides.length;
      const nextSlide = slides[activeSlideIndex];
      
      nextSlide.classList.add('active');
      document.getElementById('activeScreenTitle').innerText = nextSlide.dataset.title;

      // Single paint event theme update per slide
      cycleSlideColorTheme();
    }
    setInterval(rotateSlides, 12000);

    // MLB Prop Formatting Fix
    function formatPlayerProp(statType, statValue) {
      if (!statType) return { label: "Total Hits", line: "O/U 0.5" };
      
      const lower = statType.toLowerCase();
      if (lower.includes('avg') || lower.includes('batting') || lower.includes('.800')) {
        return { label: "Total Hits", line: "O/U 0.5" };
      }
      
      const val = parseFloat(statValue);
      if (!isNaN(val) && val < 5.0) {
        return { label: statType, line: `O/U ${(Math.floor(val) + 0.5).toFixed(1)}` };
      }

      return { label: statType, line: statValue || "O/U 1.5" };
    }

    // Fetch MLB & Live Scores
    async function fetchScores() {
      try {
        const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard');
        const data = await res.json();
        
        renderMLB(data.events || []);
        renderProps(data.events || []);
        renderLive(data.events || []);
      } catch (err) {
        console.error("Score fetch error:", err);
      }
    }

    function renderMLB(events) {
      const container = document.getElementById('container-mlb');
      if (!events.length) {
        container.innerHTML = `<div class="glass-card white-text">No MLB Games Scheduled Today</div>`;
        return;
      }

      container.innerHTML = events.map(ev => {
        const comp = ev.competitions[0];
        const home = comp.competitors.find(c => c.homeAway === 'home');
        const away = comp.competitors.find(c => c.homeAway === 'away');
        const status = ev.status.type.shortDetail;
        const isLive = ev.status.type.state === 'in';

        // Baseball Specific Situation Parsing
        const situation = comp.situation || {};
        const balls = situation.balls || 0;
        const strikes = situation.strikes || 0;
        const outs = situation.outs || 0;

        return `
          <div class="glass-card">
            <div class="card-meta">
              <span>${status}</span>
              ${isLive ? '<span class="live-tag">LIVE</span>' : ''}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin: 1vh 0;">
              <div style="display:flex; align-items:center; gap: 10px;">
                <img class="team-logo" src="${away.team.logo}" style="width:5vh; height:5vh;" onerror="getFallbackImage(this)">
                <span class="white-text" style="font-weight:800; font-size:2vh;">${away.team.abbreviation}</span>
              </div>
              <span class="white-text" style="font-size:2.5vh; font-weight:900;">${away.score || '0'}</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div style="display:flex; align-items:center; gap: 10px;">
                <img class="team-logo" src="${home.team.logo}" style="width:5vh; height:5vh;" onerror="getFallbackImage(this)">
                <span class="white-text" style="font-weight:800; font-size:2vh;">${home.team.abbreviation}</span>
              </div>
              <span class="white-text" style="font-size:2.5vh; font-weight:900;">${home.score || '0'}</span>
            </div>
            ${isLive ? `
              <div class="baseball-tracker neon-accent">
                <div>COUNT: ${balls}-${strikes}</div>
                <div>OUTS: ${outs}</div>
                <div>BASES: ${situation.onFirst ? '1B ' : ''}${situation.onSecond ? '2B ' : ''}${situation.onThird ? '3B' : 'EMPTY'}</div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function renderLive(events) {
      const container = document.getElementById('container-live');
      const liveEvents = events.filter(e => e.status.type.state === 'in');

      if (!liveEvents.length) {
        container.innerHTML = `<div class="glass-card white-text" style="grid-column: 1/-1; text-align:center;">No Games Currently Live</div>`;
        return;
      }
      renderMLB(liveEvents);
    }

    function renderProps(events) {
      const container = document.getElementById('container-props');
      let propCards = [];

      events.forEach(ev => {
        const comp = ev.competitions[0];
        (comp.competitors || []).forEach(team => {
          if (team.leaders) {
            team.leaders.forEach(leader => {
              const player = leader.leaders[0];
              if (player) {
                const prop = formatPlayerProp(leader.displayName, player.value);
                const headshot = player.athlete.headshot || team.team.logo;
                
                propCards.push(`
                  <div class="glass-card prop-card">
                    <img class="player-headshot prop-headshot" src="${headshot}" onerror="getFallbackImage(this, '${team.team.logo}')">
                    <div class="prop-details">
                      <div class="prop-player-name">${player.athlete.displayName}</div>
                      <div class="prop-type">${prop.label}</div>
                      <div class="prop-line">${prop.line}</div>
                    </div>
                  </div>
                `);
              }
            });
          }
        });
      });

      container.innerHTML = propCards.length ? propCards.join('') : `<div class="glass-card white-text">No Active Props Available</div>`;
    }

    // Trivia Engine Integration
    async function fetchTrivia() {
      try {
        const res = await fetch('https://opentdb.com/api.php?amount=1&category=21&type=multiple');
        const data = await res.json();
        if (data.results && data.results.length) {
          const q = data.results[0];
          document.getElementById('triviaCategory').innerText = q.category.toUpperCase();
          document.getElementById('triviaQuestion').innerHTML = q.question;

          let answers = [...q.incorrect_answers, q.correct_answer];
          answers.sort(() => Math.random() - 0.5);

          document.getElementById('triviaAnswers').innerHTML = answers.map(ans => `
            <div class="glass-card white-text" style="padding: 1.5vh; font-size: 1.8vh; text-align:center;">${ans}</div>
          `).join('');
        }
      } catch (e) {
        console.error("Trivia error:", e);
      }
    }

    // News Ticker Data Fetch
    async function fetchNews() {
      try {
        const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/news');
        const data = await res.json();
        const headlines = (data.articles || []).map(a => `<span class="ticker-item">⚾ ${a.headline.toUpperCase()}</span>`).join(' • ');
        document.getElementById('tickerContent').innerHTML = headlines || '<span class="ticker-item">WELCOME TO AHLERS ARCADE SPORTSBOOK TICKER</span>';
      } catch (e) {
        console.error("Ticker news error:", e);
      }
    }

    // Settings Modal Functions
    function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Boot Routine
    fetchScores();
    fetchTrivia();
    fetchNews();
    setInterval(fetchScores, 30000);
    setInterval(fetchTrivia, 60000);
  </script>
</body>
</html>
