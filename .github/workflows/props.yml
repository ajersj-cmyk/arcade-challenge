name: Refresh hot props
# Every ~3 hours (9 AM - 9 PM Eastern): player props for today's/tomorrow's games -> props.json beside index.html
# (scripts/fetch-props.mjs, Action Network public odds, no key). GitHub Pages serves it same-origin for the
# TODAY'S HOT PROPS slide, which re-reads it every 20 min. If every league fails, the script keeps the last good file.
on:
  schedule:
    - cron: '7 13,16,19,22 * * *'   # 9:07 AM, 12:07, 3:07, 6:07 PM EDT (GitHub may delay scheduled runs)
    - cron: '7 1 * * *'             # 9:07 PM EDT (late West Coast games)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: props
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build props.json
        run: node scripts/fetch-props.mjs props.json
      - name: Commit if changed
        run: |
          git config user.name  "props-bot"
          git config user.email "props-bot@users.noreply.github.com"
          git add props.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "chore: refresh hot props [skip ci]"
          git pull --rebase origin main && git push
